name: Build Railway Hermes Image
on:
  push:
    branches: [main]
    paths:
      - Dockerfile.railway
      - .github/workflows/build-railway-image.yml
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.railway
          push: true
          tags: ghcr.io/drfxai/hermes-agent-railway:latest
          platforms: linux/amd64
